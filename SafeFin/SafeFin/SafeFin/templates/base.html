<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home page</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<!-- App Download Banner -->
<div id="app-download-banner"
     style="
        position: fixed;
        bottom: 0;
        left: 50%;
        transform: translateX(-50%);
        width: 95%;
        max-width: 900px;
        background: linear-gradient(135deg, #007bff 0%, #0056b3 100%);
        color: white;
        padding: 18px 22px;
        border-radius: 14px 14px 0 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        z-index: 9999;
        box-shadow: 0 -6px 20px rgba(0,0,0,0.25);
        animation: bannerSlideUp 0.7s ease-out;
     ">

  <div style="display: flex; align-items: center; gap: 14px;">
    <!-- App Icon -->
    <div style="
          width: 48px; 
          height: 48px; 
          background: white; 
          border-radius: 12px;
          display: flex;
          align-items: center;
          justify-content: center;
          font-weight: 700;
          color: #007bff;
          font-size: 18px;
         ">
      MF
    </div>

    <!-- Text -->
    <div>
      <div style="font-size: 17px; font-weight: 600;">Download MyFin Mitra App</div>
      <div style="font-size: 14px; opacity: 0.9;">Smart financial tools • Faster experience • Secure access</div>
    </div>
  </div>

  <!-- Buttons -->
  <div style="display: flex; align-items: center; gap: 12px;">

    <a href="https://play.google.com" target="_blank"
       style="
         background: white;
         color: #007bff;
         padding: 8px 16px;
         border-radius: 8px;
         font-weight: 600;
         text-decoration: none;
         transition: 0.3s;
         box-shadow: 0 3px 8px rgba(255,255,255,0.3);
       "
       onmouseover="this.style.boxShadow='0 5px 12px rgba(255,255,255,0.5)'"
       onmouseout="this.style.boxShadow='0 3px 8px rgba(255,255,255,0.3)'">
      Download
    </a>

    <button onclick="document.getElementById('app-download-banner').style.display='none'"
            style="
              background: transparent;
              border: none;
              color: white;
              font-size: 24px;
              cursor: pointer;
            ">×</button>
  </div>

</div>

<style>
@keyframes bannerSlideUp {
  from { transform: translate(-50%, 100%); opacity: 0; }
  to   { transform: translate(-50%, 0); opacity: 1; }
}
</style>

<script>
// Disable popup on Calculator page
if (window.location.pathname.includes("calculator")) {
    const banner = document.getElementById("app-download-banner");
    if (banner) banner.style.display = "none";
}
</script>



<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">MyFin Mitra</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" 
              aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav me-auto mb-10 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="{% url 'home' %}">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="{% url 'calculator' %}">Calculator</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="{% url 'learn' %}">Learn</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="{% url 'scams' %}">Scams</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="{% url 'contact' %}">Contact Us</a>
          </li>

          <!-- <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
              Dropdown
            </a>
            <ul class="dropdown-menu">
              <li><a class="dropdown-item" href="#">Action</a></li>
              <li><a class="dropdown-item" href="#">Another action</a></li>
              <li><hr class="dropdown-divider"></li>
              <li><a class="dropdown-item" href="#">Something else here</a></li>
            </ul>
          </li> -->
          <!-- <li class="nav-item">
            <a class="nav-link disabled" aria-disabled="true">Disabled</a>
          </li> -->
        </ul>
        <form class="d-flex" role="search" method="GET" action="{% url 'search' %}">
          <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search" name="q" >

          <button class="btn btn-outline-success" type="submit"
        style="
          background-color: #28a745;
          color: white;
          border-color: #28a745;
          transition: all 0.3s ease;
          border-radius: 6px;
        "
        onmouseover="this.style.backgroundColor='#218838'; this.style.boxShadow='0 4px 10px rgba(0,0,0,0.2)'; this.style.transform='scale(1.05)'"
        onmouseout="this.style.backgroundColor='#28a745'; this.style.boxShadow='none'; this.style.transform='scale(1)'">
  Search
</button>

        </form>
      </div>
    </div>
  </nav>

{% block body %}
{% endblock body %}

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
