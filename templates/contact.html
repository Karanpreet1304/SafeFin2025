{% extends "base.html" %}
{% block body %}

<div class="container" style="max-width: 50%; margin-top: 30px;">
  <h1 class="text-center mb-5">Contact Us</h1>
<!-- 
  class="shadow p-4 rounded bg-white" -->
  <form method="post" action="{% url 'contact' %}" >
    {% csrf_token %}
    
    <div class="form-group mb-4">
      <label for="name" class="mb-2 fw-semibold">Name</label>
      <input type="text" class="form-control" id="name" name="name" placeholder="Enter Your Name">
    </div>

    <div class="form-group mb-4">
      <label for="email" class="mb-2 fw-semibold">Email address</label>
      <input type="email" class="form-control" id="email" name="email" placeholder="Enter Your Email">
    </div>

    <div class="form-group mb-4">
      <label for="phone" class="mb-2 fw-semibold">Phone No.</label>
      <input type="number" class="form-control" id="phone" name="phone" placeholder="Enter your Phone Number">
    </div>

    <div class="form-group mb-4">
      <label for="description" class="mb-2 fw-semibold">Tell me about, what you want to contact me for...</label>
      <textarea class="form-control" id="description" name="description" rows="3" placeholder="Your message..."></textarea>
    </div>

    <div class="text-center mt-4">
      <button type="submit" class="btn btn-primary px-4">Submit</button>
    </div>
  </form>
</div>

  <!-- ✅ SUCCESS MESSAGE -->
  {% if messages %}
    {% for message in messages %}
      <div class="alert alert-success alert-dismissible fade show d-block mx-auto" style="margin-top: 30px; width: 40%;" role="alert">
        {{ message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
      </div>
    {% endfor %}
  {% endif %}

{% endblock body %}
